[project]
name = "contractiq-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",       # Postgres driver (v3)
  "pgvector>=0.3",              # vector type for SQLAlchemy
  "pydantic>=2.8",
  "pydantic-settings>=2.4",     # typed .env config
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "black>=24.8"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
[tool.black]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
