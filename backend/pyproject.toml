[project]
name = "contractiq-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",       # Postgres driver (v3)
  "pgvector>=0.3",              # vector type for SQLAlchemy
  "pydantic>=2.8",
  "pydantic-settings>=2.4",     # typed .env config
  "anthropic>=0.40",            # Claude API
  "pyyaml>=6",                  # evals/questions.yaml
  "fastembed>=0.3",             # real sentence embeddings (ONNX, BAAI/bge-small-en-v1.5, no torch); falls back to hashed vectors offline
  "pyjwt[crypto]>=2.8",         # OpenID Connect token checks
  "cryptography>=42",           # encrypted connector secrets, JWT keys
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3"]  # optional: real semantic embeddings (pulls torch)
claude-code = ["claude-agent-sdk>=0.2.100"]  # run Ask on your Claude subscription (needs the `claude` CLI logged in)
dev = ["pytest>=8", "httpx>=0.27", "aiosmtpd>=1.4", "ruff>=0.6", "black>=24.8"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 160
[tool.ruff.lint]
select = ["E9", "F", "B", "I"]            # real defects (syntax, undefined / unused names, likely bugs) and import order; style rules are not enforced
ignore = ["B008", "B904", "B905", "B007", "B023", "B017"]
[tool.black]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
