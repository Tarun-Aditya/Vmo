<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ContractIQ review</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>body{font:13px Segoe UI,system-ui,sans-serif;margin:8px;color:#1e293b}input,button{font:inherit;margin:2px 0;padding:4px 6px}input{width:96%}button{cursor:pointer}
.t{border:1px solid #f59e0b;border-radius:4px;padding:6px;margin:6px 0}.t.resolved{border-color:#cbd5e1;opacity:.7}.q{font-style:italic;color:#64748b}.ai{background:#e0e7ff;border-radius:3px;padding:0 4px;font-size:11px}</style></head>
<body><h3>ContractIQ review</h3>
<details open><summary>Connection</summary>
<input id="api" placeholder="API address, e.g. https://contractiq.company.com"><input id="tok" type="password" placeholder="API token (ciq_…) or leave empty if sign-in is off"><input id="doc" placeholder="Document number (from the contract page address)">
<button id="load">Load comments</button></details>
<div id="msg" role="status"></div><div><button id="add">Comment on selected text</button><input id="body" placeholder="Your comment"></div><div id="list"></div>
<script src="taskpane.js"></script></body></html>
